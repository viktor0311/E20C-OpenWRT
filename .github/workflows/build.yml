name: Build E20C Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Download ImageBuilder
      run: |
        wget https://downloads.openwrt.org/releases/23.05.3/targets/rockchip/armv8/openwrt-imagebuilder-23.05.3-rockchip-armv8.Linux-x86_64.tar.xz
        tar -xf openwrt-imagebuilder-*.tar.xz

    - name: Build Firmware
      run: |
        cd openwrt-imagebuilder-*
        make image PROFILE=generic \

        PACKAGES="luci luci-i18n-base-zh-cn \
        kmod-wireguard wireguard-tools luci-app-wireguard \
        luci-app-smartdns \
        ddns-go luci-app-qos luci-app-nlbwmon"

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: openwrt-imagebuilder-*/bin/targets/
